name: S.I.G.O.I. CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql, curl, mbstring, fileinfo, zip
          tools: composer:v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Static safety checks
        run: php tests/static_checks.php
